<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6fb2"/>
      <stop offset="50%" stop-color="#041827"/>
      <stop offset="100%" stop-color="#02101d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lockGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradient)"/>
  <circle cx="400" cy="320" r="260" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#0b2940" stroke-width="1" opacity="0.45">
    <path d="M80 200h640M80 260h640M80 320h640M80 380h640M80 440h640"/>
    <path d="M200 120v520M260 120v520M320 120v520M380 120v520M440 120v520M500 120v520M560 120v520"/>
  </g>

  <!-- Shield -->
  <g transform="translate(150 120)">
    <path d="M250 0L80 60v176c0 116 84 214 170 240 86-26 170-124 170-240V60L250 0z" fill="url(#shieldGradient)" stroke="#0ea5e9" stroke-width="5"/>

    <!-- EMEA arc lines (stylized globe / regions) -->
    <g stroke="#22c55e" stroke-width="3" opacity="0.65">
      <path d="M90 180c40-46 102-76 160-76 60 0 122 30 162 78" fill="none"/>
      <path d="M90 220c40 46 102 76 160 76 60 0 122-30 162-78" fill="none"/>
      <path d="M160 150c26-20 54-30 90-30 38 0 74 12 102 34" fill="none" opacity="0.8"/>
      <path d="M160 250c26 20 54 30 90 30 38 0 74-12 102-34" fill="none" opacity="0.8"/>
    </g>

    <!-- Lock body -->
    <g transform="translate(155 185)">
      <rect x="0" y="70" width="190" height="140" rx="22" fill="url(#lockGradient)" stroke="#111827" stroke-width="4"/>

      <!-- Lock shackle -->
      <!-- New shackle: starts exactly at top corners of the body (x=22 and x=168),
           rises smoothly and comes back down so it visually "verankert" in het slot. -->
      <path
        d="M22 70
           v-28
           c0-40 30-70 73-70
           s73 30 73 70
           v28"
        fill="none"
        stroke="#e5e7eb"
        stroke-width="14"
        stroke-linecap="round"
      />

      <!-- Keyhole -->
      <circle cx="95" cy="140" r="18" fill="#111827"/>
      <rect x="88" y="148" width="14" height="30" rx="6" fill="#111827"/>

      <!-- Cyber connections -->
      <g stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-22" cy="40" r="7" fill="#22c55e"/>
        <circle cx="212" cy="40" r="7" fill="#22c55e"/>
        <circle cx="-22" cy="160" r="7" fill="#22c55e"/>
        <circle cx="212" cy="160" r="7" fill="#22c55e"/>

        <path d="M-22 40H20l18-18h60"/>
        <path d="M212 40H170l-18-18h-60"/>
        <path d="M-22 160H20l18 18h60"/>
        <path d="M212 160H170l-18 18h-60"/>
      </g>
    </g>

    <!-- Subtle football arc to hint at Real Madrid collaboration without logo -->
    <path d="M150 340c30 40 80 66 134 66 54 0 104-26 134-66" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Text: top label (bigger, no year) -->
  <text x="400" y="90" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" letter-spacing="6" opacity="0.95">
    CISCO NETACAD CUP
  </text>

  <!-- Text block under shield -->
  <text x="400" y="640" text-anchor="middle" fill="#a5f3fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" letter-spacing="5">
    CYBERSECURITY HACKING CHALLENGE
  </text>

  <text x="400" y="680" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="3" opacity="0.95">
    EUROPE · MIDDLE EAST · AFRICA
  </text>

  <text x="400" y="715" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" letter-spacing="2.5">
    EDUCATIONAL CAPTURE THE FLAG COMPETITION
  </text>
</svg>